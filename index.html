<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DriveLog</title>

<style>

*{
    box-sizing:border-box;
}
h2{
    text-align: center;
}
body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;
    background:#f2f2f7;
}

.app{
    max-width:500px;
    margin:auto;
    min-height:100vh;
}

header{
    text-align:center;
    padding:14px;
}

header h1{
    margin:0;
    font-size:34px;
}

.card{
    background:white;
    margin:15px;
    padding:20px;
    border-radius:20px;
    box-shadow:0 3px 10px rgba(0,0,0,.12);
}

.stats{
    display:flex;
    justify-content:space-around;
    text-align:center;
}

.stats span{
    display:block;
    color:#777;
}

.stats strong{
    font-size:24px;
}

button{
    width:100%;
    padding:25px;
    margin-top:15px;
    border:none;
    border-radius:18px;
    font-size:20px;
    font-weight:bold;
}

.business{
    background:#0303B8;
    color:white;
}

.personal{
    background:rgb(85, 255, 0);
    color:black;
}

#export-btn{
    background: #ff80ff;
}
#clear-btn{
    background: red;
}

#export-btn,
#clear-btn{
    color: black;
    width:100%;
    padding:20px;
    margin-top:15px;
    border:none;
    border-radius:18px;
    font-size:20px;
    font-weight:bold;
}
.stop{

    background:#ff3b30;
    color:white;
}

.history-edit{

    background:#646c76;
    color:white;
    padding:10px;
    font-size:14px;
    width:25%;

}


.history-delete{

    background:#ff3b30;
    color:white;
    padding:10px;
    font-size:14px;
    width:25%;

}

label{

    display:block;
    margin-top:10px;
    font-weight:bold;

}

input, select{

    width:50%;
    padding:15px;
    margin-top:5px;
    border-radius:12px;
    border:1px solid #ccc;
    font-size:18px;

}

.hidden{
    display:none;
}

.value{
    font-size:28px;
    font-weight:bold;
    text-align:center;
}

.status{
    text-align:center;
    color:#555;
}

.activeBanner{
    text-align:center;
    font-size:18px;
    font-weight:bold;
    color:white;
    padding: 10px;
    border: 2px solid #80fff9;
    border-radius: 8px;
    background-color: #80e1ff;
    margin: 20px;
}

</style>

</head>


<body>
    <div class="card">
        <header>
            <div id="tripStatus" class="activeBanner hidden">

            </div>

            <h1>DriveLog</h1>
            <p>Vehicle Milage Tracker</p>
        </header>
        <!--Status-->
        
    </div>
    
    <!--Ready To Drive-->
    <div class="card">
        <h2>Ready to Drive</h2>
        <button class="business" onclick="startTrip('Business')">Start Business Trip</button>
        <button class="personal" onclick="startTrip('Personal')">Start Personal Trip</button>
    </div>

    <!--Summary-->
    <div class="card">
        <h2>Summary</h2>
        <div class="stats">
            <div>
                <span>Business</span><strong id="businessKm">0 km</strong>
            </div>
            <div>
                <span>Personal</span><strong id="personalKm">0 km</strong>
            </div>
        </div>
    </div>
    
    
    <div id="activeTrip" class="card hidden">
        <h2 id="tripTitle">Trip Active</h2>
        <div class="value" id="distance">0.00 km

        </div>

        
        
        <p class="status">Distance</p>
        <div class="value" id="speed">0 km/h

        </div>
        <p class="status">Speed</p>
        
        <div class="value" id="timer">00:00:00

        </div>
        <p class="status">Duration</p>
        <button class="stop" onclick="endTrip()">End Trip</button>
    </div>
    <div class="card">
        <h2>Trip History</h2>
        <div id="history">No trips recorded

        </div>
    </div>
    <div id="editCard" class="card hidden">
            <h2>Edit Trip</h2>
            <label>Trip Type</label>
            <select id="editType">
                <option value="Business">Business</option>
                <option value="Personal">Personal</option>
            </select>
            <label>Distance (km)</label>
            <input id="editDistance" type="number" step="0.1">
            <button onclick="saveEdit()" class="business">Save Changes</button>
            <button onclick="cancelEdit()" class="stop">Cancel</button>
        </div>
    
        <div class="card">
            <h2>Tools</h2>
            <button onclick="exportCSV()" id="export-btn">Export Trip Data</button>
            <button onclick="clearTrips()" id="clear-btn">Clear Trip Data</button>
        </div>
        
    </div>

<script>

let tripActive=false;

let tripType="";

let watchID=null;

let lastPosition=null;

let totalDistance=0;

let startTime=null;

let timer=null;

let trips = JSON.parse(localStorage.getItem("trips")) || [];


function startTrip(type){


if(tripActive){

return;

}


tripActive=true;

tripType=type;


document.getElementById("activeTrip").classList.remove("hidden");


document.getElementById("tripTitle").innerHTML = type+" Trip";
let status = document.getElementById("tripStatus"); status.innerHTML = type + " Trip Active";

status.classList.remove("hidden");


totalDistance=0;

lastPosition=null;


startTime=new Date();


startTimer();


if(!navigator.geolocation){

alert("GPS not supported");

return;

}



watchID=navigator.geolocation.watchPosition(

locationUpdate,

locationError,

{

enableHighAccuracy:true,

maximumAge:0,

timeout:10000

}

);


}

function locationUpdate(position){


let lat =
position.coords.latitude;


let lon =
position.coords.longitude;


let speed =
position.coords.speed;



if(lastPosition){


let distance =
calcDistance(

lastPosition.lat,

lastPosition.lon,

lat,

lon

);



/*

Ignore GPS drift

Only count movement if:

- more than 5 meters

- moving faster than 5 km/h

*/


let speedKmh =
speed ? speed*3.6 : 0;



if(distance > 0.005 && speedKmh > 5){


totalDistance += distance;


document.getElementById("distance")
.innerHTML =
totalDistance.toFixed(2)
+" km";


}


}



lastPosition={

lat:lat,

lon:lon

};



if(speed){


document.getElementById("speed")
.innerHTML =
(speed*3.6)
.toFixed(0)
+" km/h";


}



}

function calcDistance(lat1,lon1,lat2,lon2){


const R=6371;


let dLat=
(lat2-lat1)
*Math.PI/180;


let dLon=
(lon2-lon1)
*Math.PI/180;


let a=

Math.sin(dLat/2)*
Math.sin(dLat/2)

+

Math.cos(lat1*Math.PI/180)

*

Math.cos(lat2*Math.PI/180)

*

Math.sin(dLon/2)

*

Math.sin(dLon/2);



let c=
2*Math.atan2(
Math.sqrt(a),
Math.sqrt(1-a)
);



return R*c;


}

function startTimer(){


timer=setInterval(()=>{


let seconds=
Math.floor(
(new Date()-startTime)/1000
);



let h=
Math.floor(seconds/3600);


let m=
Math.floor(
(seconds%3600)/60
);


let s=
seconds%60;



document.getElementById("timer")
.innerHTML=

pad(h)+":"+
pad(m)+":"+
pad(s);



},1000);


}

function pad(x){

return x.toString()
.padStart(2,"0");

}

function endTrip(){

    if(watchID){

        navigator.geolocation.clearWatch(watchID);

    }

    clearInterval(timer);


    let endTime = new Date();


    let trip = {

        type: tripType,

        date: new Date().toISOString(),

        startTime: startTime,

        endTime: endTime,

        distance: Number(totalDistance.toFixed(2))

    };


    trips.push(trip);


    localStorage.setItem(
        "trips",
        JSON.stringify(trips)
    );


    updateSummary();

    showHistory();


    alert(
        tripType +
        " trip saved\n\nDistance: " +
        totalDistance.toFixed(2) +
        " km"
    );


    tripActive=false;


    document.getElementById("activeTrip")
    .classList.add("hidden");


}

function locationError(error){

alert(
"GPS Error: "
+error.message
);

}

function updateSummary(){


    let businessTotal=0;

    let personalTotal=0;


    let currentMonth =
    new Date().getMonth();


    let businessMonth=0;

    let personalMonth=0;



    trips.forEach(trip=>{


        if(trip.type==="Business"){

            businessTotal += trip.distance;

        }


        if(trip.type==="Personal"){

            personalTotal += trip.distance;

        }



        let tripDate =
        new Date(trip.date);



        if(tripDate.getMonth()===currentMonth){


            if(trip.type==="Business"){

                businessMonth += trip.distance;

            }


            if(trip.type==="Personal"){

                personalMonth += trip.distance;

            }

        }


    });



    document.getElementById("businessKm")
    .innerHTML =
    "Total: " +
    businessTotal.toFixed(1)
    +" km<br>" +
    "Month: " +
    businessMonth.toFixed(1)
    +" km";



    document.getElementById("personalKm")
    .innerHTML =
    "Total: " +
    personalTotal.toFixed(1)
    +" km<br>" +
    "Month: " +
    personalMonth.toFixed(1)
    +" km";


}

function simulateTrip(){

    let fakeTrip = {

        type:"Business",

        date:new Date().toISOString(),

        startTime:new Date(),

        endTime:new Date(),

        distance:25

    };


    trips.push(fakeTrip);


    localStorage.setItem(
        "trips",
        JSON.stringify(trips)
    );


    updateSummary();


    alert(
        "Test trip added\n\n25 km Business"
    );

}

function showHistory(){

    let history =
    document.getElementById("history");


    if(trips.length === 0){

        history.innerHTML =
        "No trips recorded";

        return;

    }


    history.innerHTML="";


    trips
    .slice()
    .reverse()
    .forEach((trip,index)=>{


        let realIndex =
        trips.length - 1 - index;


        let date =
        new Date(trip.date);


        history.innerHTML += `

        <div style="
        padding:10px;
        border-bottom:1px solid #ddd;
        ">

        <strong>${trip.type}</strong>

        <br>

        ${date.toLocaleDateString()}

        <br>

        ${trip.distance.toFixed(1)} km


        <br>


        <button onclick="editTrip(${realIndex})" class="history-edit">Edit</button>

        <button onclick="deleteTrip(${realIndex})" class="history-delete">Delete</button>

        </div>

        `;


    });


}

function exportCSV(){

    if(trips.length === 0){

        alert("No trips to export");

        return;

    }


    let csv = 
    "Date,Type,Start Time,End Time,Distance (km)\n";


    trips.forEach(trip=>{


        let date =
        new Date(trip.date);


        let start =
        new Date(trip.startTime);


        let end =
        new Date(trip.endTime);



        csv +=

        date.toLocaleDateString()
        +","+

        trip.type
        +","+

        start.toLocaleTimeString()
        +","+

        end.toLocaleTimeString()
        +","+

        trip.distance.toFixed(2)

        +"\n";


    });



    let blob =
    new Blob(
        [csv],
        {
            type:"text/csv"
        }
    );


    let url =
    URL.createObjectURL(blob);



    let link =
    document.createElement("a");


    link.href=url;


    link.download=
    "DriveLog_Report.csv";


    link.click();


    URL.revokeObjectURL(url);


}

function clearTrips(){

    let confirmDelete =
    confirm(
        "Delete all saved trips?"
    );


    if(confirmDelete){

        trips = [];


        localStorage.removeItem("trips");


        updateSummary();


        showHistory();


        alert("Trip data cleared");

    }

}

let editIndex = null;

function editTrip(index){

    editIndex = index;


    let trip = trips[index];


    document.getElementById("editType").value =
    trip.type;


    document.getElementById("editDistance").value =
    trip.distance;


    document.getElementById("editCard")
    .classList.remove("hidden");


}

function saveEdit(){

    if(editIndex === null){
        return;
    }


    trips[editIndex].type =
    document.getElementById("editType").value;


    trips[editIndex].distance =
    Number(
        document.getElementById("editDistance").value
    );


    localStorage.setItem(
        "trips",
        JSON.stringify(trips)
    );


    updateSummary();

    showHistory();


    cancelEdit();

}

function cancelEdit(){

    editIndex=null;


    document.getElementById("editCard")
    .classList.add("hidden");

}

function deleteTrip(index){

    let confirmDelete =
    confirm(
        "Delete this trip?"
    );


    if(confirmDelete){

        trips.splice(index,1);


        localStorage.setItem(
            "trips",
            JSON.stringify(trips)
        );


        updateSummary();

        showHistory();

    }

}

window.onload=function(){

    updateSummary();

    showHistory();

}
</script>


</body>

</html>
